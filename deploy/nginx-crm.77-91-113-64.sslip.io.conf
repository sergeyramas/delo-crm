# crm.77-91-113-64.sslip.io → 127.0.0.1:8091
# Скопировать в sites-available и включить. 8091 наружу не открывать.
# TLS: certbot --nginx -d crm.77-91-113-64.sslip.io
# На Ядре ~1.8G RAM. К приложению мало соединений: один процесс, workers=1.
# keepalive 4 — не плодить коннекты к uvicorn (у него limit_concurrency=20).

upstream delo_crm {
    server 127.0.0.1:8091;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.77-91-113-64.sslip.io;

    client_max_body_size 12m;

    # Пароль на UI, если AUTH_MODE=proxy.
    # htpasswd лежит в /srv, не в /root: nginx (www-data) /root не читает.
    #   htpasswd -c /srv/ati/secrets/delo-crm.htpasswd andrey
    # Если вход делает само приложение (AUTH_MODE=basic, Сергей и Андрей),
    # эти две строки уберите — иначе пароль спросится дважды.
    auth_basic "ATI Delivery CRM";
    auth_basic_user_file /srv/ati/secrets/delo-crm.htpasswd;

    location /s/ {
        # Вход пакетов только с самой машины (IMAP-воркер или curl Вишну).
        # Секрет всё равно проверяет приложение. Basic auth здесь выключен,
        # иначе воркер упрётся в пароль браузера.
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://delo_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://delo_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
