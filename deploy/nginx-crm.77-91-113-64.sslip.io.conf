# crm.77-91-113-64.sslip.io → 127.0.0.1:8091
# Скопировать в sites-available и включить. 8091 наружу не открывать.
# TLS: certbot --nginx -d crm.77-91-113-64.sslip.io после того, как :80 отвечает.

server {
    listen 80;
    listen [::]:80;
    server_name crm.77-91-113-64.sslip.io;

    client_max_body_size 12m;

    # Один пароль на UI. Файл вне репозитория: htpasswd -c /srv/ati/secrets/delo-crm.htpasswd andrey
    auth_basic "ATI Delivery CRM";
    auth_basic_user_file /srv/ati/secrets/delo-crm.htpasswd;

    location /s/ {
        # Вход пакетов только с самой машины (IMAP-воркер или curl Вишну).
        # Секрет всё равно проверяет приложение. Basic auth здесь выключен,
        # иначе воркер упрётся в пароль браузера.
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
