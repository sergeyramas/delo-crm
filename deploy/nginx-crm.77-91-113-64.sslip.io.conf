# УСТАРЕЛО. НЕ ДЛЯ ЯДРА. НЕ КОПИРОВАТЬ.
#
# На Ядре (77.91.113.64) nginx в Docker. Живой шаблон:
#   deploy/nginx-crm.yadro-docker.conf
# Путь на сервере: /data/nginx/user_conf.d/
# Upstream: 172.18.0.1:8091. В живом конфиге client_max_body_size 16m.
#
# Этот файл — старый host-nginx: listen 80, upstream 127.0.0.1:8091, htpasswd.
# Его нельзя класть в /etc/nginx/sites-available и нельзя копировать поверх
# файла в /data/nginx/user_conf.d/: из контейнера 127.0.0.1 — это сам nginx,
# а auth_basic ломает текущий вход. systemctl reload nginx на Ядре не делать.
# Перечитывать контейнер: docker exec ИМЯ_КОНТЕЙНЕРА_NGINX_НА_ЯДРЕ nginx -t
# и nginx -s reload. Имя контейнера в репозитории нет.
#
# Ниже текст оставлен только как архив. Для выкладки он не используется.

upstream delo_crm {
    server 127.0.0.1:8091;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.77-91-113-64.sslip.io;

    # 16m: скан водителя до 12 МиБ плюс поля формы. Сами файлы наружу не отдаются.
    client_max_body_size 16m;

    # Пароль на UI, если AUTH_MODE=proxy.
    # htpasswd лежит в /srv, не в /root: nginx (www-data) /root не читает.
    #   htpasswd -c /srv/ati/secrets/delo-crm.htpasswd andrey
    # Если вход делает само приложение (AUTH_MODE=basic, Сергей и Андрей),
    # эти две строки уберите — иначе пароль спросится дважды.
    auth_basic "ATI Delivery CRM";
    auth_basic_user_file /srv/ati/secrets/delo-crm.htpasswd;

    location /s/ {
        # Вход пакетов только с самой машины (IMAP-воркер или curl Вишну).
        # Секрет всё равно проверяет приложение. Basic auth здесь выключен,
        # иначе воркер упрётся в пароль браузера.
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://delo_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://delo_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
