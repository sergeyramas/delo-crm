# Ядро 77.91.113.64. Nginx здесь в Docker, не в systemd хоста.
#
# Куда класть файл: /data/nginx/user_conf.d/
# Имя файла на сервере и имя контейнера nginx в репозитории не зафиксированы.
# Плейсхолдер в командах: ИМЯ_КОНТЕЙНЕРА_NGINX_НА_ЯДРЕ.
#
# Не копировать в /etc/nginx/sites-available и не затирать уже живой server{},
# если в нём есть TLS и свои location. На проде в живой конфиг вручную
# добавлен только client_max_body_size 16m. Пока в нём есть три строки ниже,
# этот файл поверх не класть.
#
#   server_name crm.77-91-113-64.sslip.io;
#   client_max_body_size 16m;
#   proxy_pass http://172.18.0.1:8091;
#
# Устарелый шаблон host-nginx (listen 80, upstream 127.0.0.1:8091, htpasswd):
#   deploy/nginx-crm.77-91-113-64.sslip.io.conf
# На Ядро его не ставить. Из контейнера 127.0.0.1 — это сам nginx.
# Приложение слушает 127.0.0.1:8091 на хосте. Контейнер ходит на шлюз моста.
# Порт 8091 в firewall не открывать. Пароль nginx из старого шаблона сюда не переносить.

upstream delo_crm {
    # Шлюз docker-моста → uvicorn на хосте. Не 127.0.0.1.
    server 172.18.0.1:8091;
    keepalive 4;
}

server {
    # Слушает контейнер. Привязку listen к 127.0.0.1 не ставить.
    # TLS остаётся в уже живом конфиге Ядра: этот блок не подменяет 443.
    listen 80;
    server_name crm.77-91-113-64.sslip.io;

    # 16m: скан водителя до 12 МиБ плюс поля формы.
    client_max_body_size 16m;

    location / {
        proxy_pass http://delo_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
