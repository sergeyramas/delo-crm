# Ядро 77.91.113.64. Nginx здесь в Docker, не в systemd хоста.
#
# Куда класть файл: /data/nginx/user_conf.d/
# Имя файла на сервере и имя контейнера nginx в репозитории не зафиксированы.
# Плейсхолдер в командах: ИМЯ_КОНТЕЙНЕРА_NGINX_НА_ЯДРЕ.
#
# Живой файл правят в /data/nginx/user_conf.d/, не в /etc/nginx/sites-available.
# Не затирать уже живой server{}, если в нём есть TLS.
# На проде вручную уже добавлен client_max_body_size 16m.
# Сверить и поправить в том файле:
#
#   server_name crm.77-91-113-64.sslip.io;
#   client_max_body_size 16m;
#   proxy_pass http://172.18.0.1:8091;
#   location /s/ — allow 172.18.0.1 и 172.18.0.0/16, не allow 127.0.0.1
#   location экрана — без deny
#
# Устаревший шаблон host-nginx (listen 80, upstream 127.0.0.1:8091, пароль nginx):
#   deploy/nginx-crm.77-91-113-64.sslip.io.conf
# На Ядро его не ставить. Из контейнера 127.0.0.1 — это сам nginx.
# Приложение слушает 127.0.0.1:8091 на хосте. Контейнер ходит на шлюз моста.
# Порт 8091 в firewall не открывать.
# Пароль host-nginx на server не переносить: файла пароля в контейнере нет,
# из-за него экран не откроется. deny только у шлюза /s/, не у экрана.

upstream delo_crm {
    # Шлюз docker-моста → uvicorn на хосте. Не 127.0.0.1.
    server 172.18.0.1:8091;
    keepalive 4;
}

server {
    # Слушает контейнер. Привязку listen к 127.0.0.1 не ставить.
    # TLS остаётся в уже живом конфиге Ядра: этот блок не подменяет 443.
    listen 80;
    server_name crm.77-91-113-64.sslip.io;

    # 16m: скан водителя до 12 МиБ плюс поля формы.
    client_max_body_size 16m;

    location /s/ {
        # Импорт с хоста Ядра бьёт в опубликованный порт. Внутри контейнера
        # источник — шлюз моста, не 127.0.0.1: 127.0.0.1 здесь сам nginx.
        # 172.18.0.1 — этот шлюз. 172.18.0.0/16 — весь мост, если импорт
        # виден с другого адреса моста. Когда IP известен точно, оставьте его
        # один и строку с /16 уберите.
        # auth_basic off: если на живом server уже есть пароль экрана,
        # шлюз его не спрашивает. На экран это не действует.
        auth_basic off;
        allow 172.18.0.1;
        allow 172.18.0.0/16;
        deny all;
        proxy_pass http://delo_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        # Экран. allow/deny сюда не ставить: иначе UI закроется вместе со шлюзом.
        proxy_pass http://delo_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
